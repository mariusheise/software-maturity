name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: build and sbom
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          pip install -r .devcontainer/requirements.txt
          conan profile detect --force
      - name: Build and test
        run: scripts/build.sh Release
      - name: Package
        run: |
          mkdir dist
          tar -czf "dist/maturity-${TAG}-linux-x86_64.tar.gz" -C build/Release maturity_app
      - name: Lock dependencies for the SBOM
        run: |
          mkdir sbom-src
          conan lock create . --lockfile-out=sbom-src/conan.lock \
            -s build_type=Release -s compiler.cppstd=20
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-src
          format: cyclonedx-json
          output-file: dist/maturity-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: attest and publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/maturity-${{ github.ref_name }}.cdx.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" dist/* --verify-tag --generate-notes

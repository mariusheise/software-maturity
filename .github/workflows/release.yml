name: Release

on:
  workflow_call:
    inputs:
      product:
        description: Conan option "product" to build; the tag must be <product>_v<version>.
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: build and sbom
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      PRODUCT: ${{ inputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the tag matches the product
        run: |
          if [[ "${TAG}" != "${PRODUCT}_v"* ]]; then
            echo "Tag ${TAG} does not match product ${PRODUCT}" >&2
            exit 1
          fi
      - name: Install tooling
        run: pip install -r .devcontainer/requirements.txt
      - name: Install Conan config
        run: scripts/conan_bootstrap.sh && conan config install-pkg .
      - name: Build and test
        run: scripts/build.sh Release
      - name: Package
        run: |
          mkdir dist
          tar -czf "dist/maturity-${TAG}-linux-x86_64.tar.gz" -C build/Release maturity_app
      - name: Coverage report
        run: |
          scripts/coverage.sh
          cp coverage-report.html "dist/maturity-${TAG}-coverage.html"
      - name: Stage the committed lockfile for the SBOM
        run: |
          mkdir sbom-src
          cp "products/${PRODUCT}.lock" sbom-src/conan.lock
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-src
          format: cyclonedx-json
          output-file: dist/maturity-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: attest and publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*-coverage.html
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/maturity-${{ github.ref_name }}.cdx.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "${TAG}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${TAG}" dist/* --verify-tag --generate-notes "${flags[@]}"

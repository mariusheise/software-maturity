name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

  build-test:
    name: build-test (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          pip install -r .devcontainer/requirements.txt
          conan profile detect --force
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('conanfile.py') }}
      - name: Build and test
        run: scripts/build.sh ${{ matrix.build_type }}

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          pip install -r .devcontainer/requirements.txt
          conan profile detect --force
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-Debug-${{ hashFiles('conanfile.py') }}
      - name: Build, test and enforce coverage gate
        run: scripts/coverage.sh
      - name: Annotate uncovered lines and write summary
        if: ${{ !cancelled() && hashFiles('coverage.json') != '' }}
        run: python3 scripts/coverage_annotate.py coverage.json coverage-summary.md coverage-badge.svg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('coverage.json') != '' }}
        with:
          name: coverage
          path: |
            coverage-html/
            coverage-summary.md
            coverage-badge.svg
            coverage.xml

  coverage-comment:
    name: coverage comment
    needs: coverage
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Create or update the coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          printf 'Coloured source report for this PR: download the coverage-html folder from the coverage artifact on the [workflow run](%s). Latest main: [browse online](%s).\n' "${RUN_URL}" "${PAGES_URL}" >> coverage-summary.md
          id=$(gh api --paginate "repos/${GH_REPO}/issues/${PR}/comments" \
            --jq '.[] | select(.body | startswith("<!-- coverage-comment -->")) | .id' | head -n1)
          if [ -n "${id}" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${id}" -F body=@coverage-summary.md
          else
            gh api -X POST "repos/${GH_REPO}/issues/${PR}/comments" -F body=@coverage-summary.md
          fi

  coverage-pages:
    name: publish coverage report
    needs: coverage
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Assemble site
        run: |
          mkdir site
          cp -r coverage-html/. site/
          cp coverage-badge.svg site/coverage.svg
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  secrets:
    name: secrets (betterleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false
      - name: Install betterleaks
        run: go install github.com/betterleaks/betterleaks@v1.9.0
      - name: Scan full git history
        run: |
          "$(go env GOPATH)/bin/betterleaks" git --redact --verbose
